{% extends 'layout.html' %}

{% block page_body %}
<div class="row">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <form
                        action="{{ request.app.admin_path }}/{{ resource }}/list"
                        method="get"
                        class="w-100"
                >
                    <div class="d-flex">
                        <div class="text-muted">
                            {{ _('show') }}
                            <div class="mx-2 d-inline-block">
                                <input
                                        type="text"
                                        class="form-control"
                                        value="{{ page_size }}"
                                        size="2"
                                        name="page_size"
                                        aria-label="entries count"
                                />
                            </div>
                            {{ _('entries') }}
                        </div>
                        <div class="d-flex ms-auto">
                            {% for filter in filters %}
                                <div class="mx-2">{{ filter|safe }}</div>
                            {% endfor %}
                            <div class="ms-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-search me-2"></i>
                                    {{ _('search') }}
                                </button>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="card-body">
                <h5 class="card-title">Dashboard SLA por Dependência</h5>
                <div class="row">
                    <div class="col-md-6 mb-4">
                        <canvas id="availabilityChart" height="200"></canvas>
                    </div>
                    <div class="col-md-6 mb-4">
                        <canvas id="responseTimeChart" height="200"></canvas>
                    </div>
                    <div class="col-md-6 mb-4">
                        <canvas id="cpuChart" height="200"></canvas>
                    </div>
                    <div class="col-md-6 mb-4">
                        <canvas id="memoryChart" height="200"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- CHART.JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const labels = {{ sla_reports | map(attribute='timestamp') | list | tojson }};
    const availabilityData = {{ sla_reports | map(attribute='availability') | map('default',0) | list | tojson }};
    const responseTimeData = {{ sla_reports | map(attribute='response_time') | map('default',0) | list | tojson }};
    const cpuData = {{ sla_reports | map(attribute='cpu') | map('default',0) | list | tojson }};
    const memoryData = {{ sla_reports | map(attribute='memory') | map('default',0) | list | tojson }};

    function createChart(id, label, data, borderColor, backgroundColor, suffix="") {
        new Chart(document.getElementById(id).getContext('2d'), {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: label,
                    data: data,
                    borderColor: borderColor,
                    backgroundColor: backgroundColor,
                    tension: 0.2,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    title: { display: true, text: label },
                    legend: { display: false }
                },
                scales: {
                    x: { type: 'category', title: { display: true, text: 'Timestamp' } },
                    y: { beginAtZero: true, ticks: { callback: value => value + suffix } }
                }
            }
        });
    }

    // Criar gráficos com cores diferentes
    createChart("availabilityChart", "Disponibilidade (%)", availabilityData.map(v => v*100),
        "rgba(0,123,255,1)", "rgba(0,123,255,0.2)", "%"); // azul
    createChart("responseTimeChart", "Tempo de Resposta (s)", responseTimeData,
        "rgba(255,193,7,1)", "rgba(255,193,7,0.2)", "s"); // amarelo
    createChart("cpuChart", "Uso de CPU (%)", cpuData,
        "rgba(220,53,69,1)", "rgba(220,53,69,0.2)", "%"); // vermelho
    createChart("memoryChart", "Uso de Memória (%)", memoryData,
        "rgba(40,167,69,1)", "rgba(40,167,69,0.2)", "%"); // verde
</script>

{% endblock %}
