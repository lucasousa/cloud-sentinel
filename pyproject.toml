[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-sentinel"
version = "0.1.0"
description = "Cloud Sentinel - Monitoring multi-cloud dependencies"
authors = [{ name = "Lucas Sousa" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "tortoise-orm==0.25.1",
    "redis[asyncio]>=4.5.0",
    "psutil==7.0.0",
    "prometheus_client==0.22.1",
    "httpx==0.28.1"
]
